<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCG Watch 3.8</title><style>
*{box-sizing:border-box}body{background:#0c1423;color:#edf3ff;font-family:system-ui,sans-serif;margin:0 auto;padding:18px;max-width:800px}h1{font-size:24px}h2{font-size:18px;margin-top:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.panel{background:#19263a;border:1px solid #34445d;border-radius:14px;padding:14px;margin-top:10px}.card strong{display:block;font-size:26px}.muted{font-size:12px;color:#aabbd0}.row{border-bottom:1px solid #34445d;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.row:last-child{border:0}.item{border-bottom:1px solid #34445d;padding:14px 0}.item:last-child{border:0}a{color:#9ccaff}button{background:#365c92;color:white;border:0;padding:11px 15px;border-radius:10px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}
</style></head><body><header><div><h1>🃏 TCG Watch</h1><div class="muted">監視ダッシュボード Ver.3.8</div></div><button id="reload">更新</button></header><p id="date" class="muted">読み込み中…</p><p id="status" role="status"></p><div class="grid"><div class="card"><strong id="hits">—</strong><span class="muted">検索ヒット</span></div><div class="card"><strong id="accepted">—</strong><span class="muted">条件一致</span></div><div class="card"><strong id="notified">—</strong><span class="muted">今回通知</span></div></div><h2>監視商品</h2><div class="panel" id="targets"></div><h2>除外理由</h2><div class="panel" id="rejected"></div><h2>購入・予約候補</h2><div class="panel" id="products"></div><p class="muted">※ APIの情報は購入・予約を保証しません。販売ページで最終確認してください。価格超過商品の個別価格は現在の結果データには保存されていません。楽天市場は未対応です。</p><script>
const $=id=>document.getElementById(id);const names={UA62BT:'ジョジョ ブースターBOX',UA62ST:'ジョジョ スタートデッキ',GD07:'ガンダム GD07',onepiece:'ワンピース'};const reasons={priceExcluded:'価格超過',nameExcluded:'商品名不一致',outOfStockExcluded:'在庫なし',unavailableExcluded:'予約終了・売り切れ',unknownStockExcluded:'在庫不明',invalidUrl:'URL不正',duplicateExcluded:'重複'};const n=x=>Number(x||0).toLocaleString('ja-JP');function make(tag,text){const e=document.createElement(tag);e.textContent=String(text);return e}function line(root,label,value){const r=make('div','');r.className='row';r.append(make('span',label),make('strong',value));root.append(r)}function reset(id){$(id).replaceChildren();return $(id)}
async function load(){ $('reload').disabled=true;try{const response=await fetch('./data/results.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json(),d=data.diagnostics||{},items=data.items||[];$('hits').textContent=n(d.apiHits);$('accepted').textContent=n(d.accepted);$('notified').textContent=n(data.notifiedCount);$('date').textContent='最終検索: '+new Date(data.checkedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+'（日本時間）';const t=reset('targets');for(const [id,v] of Object.entries(data.byTarget||{}))line(t,names[id]||id,`${n(v.accepted)}件 / 検索${n(v.apiHits)}件`);const r=reset('rejected');for(const [key,label] of Object.entries(reasons))if(d[key])line(r,label,n(d[key])+'件');const p=reset('products');if(!items.length)p.append(make('p','現在、条件に合う候補はありません。'));for(const item of items){const e=make('div','');e.className='item';e.append(make('div',item.target||''),make('h3',item.name||'商品名なし'),make('strong','¥'+n(item.price)),make('p',item.status||'販売ページで確認'));if(item.notificationReason)e.append(make('p',item.notificationReason));if(typeof item.url==='string'&&item.url.startsWith('https://')){const a=make('a','販売ページを開く');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';e.append(a)}p.append(e)}const errs=data.errors||[];$('status').textContent=errs.length?'検索エラー: '+errs.join(' / '):'データ読み込み成功';}catch(e){$('status').textContent='読み込み失敗: '+e.message+'。GitHub Pages設定を確認してください。'}finally{$('reload').disabled=false}}$('reload').addEventListener('click',load);load();
</script></body></html>
