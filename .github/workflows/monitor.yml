
name: TCG reservation candidate monitor

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Send test notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tcg-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: '1'
        run: python worker/monitor.py

      - name: Search allowed API and notify
        if: ${{ !inputs.test_notify }}
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python worker/monitor.py

      - name: Save latest results and notification history
        if: ${{ !inputs.test_notify }}
        shell: bash
        run: |
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add docs/data/results.json worker/state.json

          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi

          git commit -m 'Update monitored candidates'

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Results saved successfully"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; manual review required"
              exit 1
            fi

            echo "Retrying push ($attempt/3)"
            sleep 3
          done

          echo "Failed to save results after 3 attempts"
          exit 1
