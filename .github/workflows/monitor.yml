name: TCG reservation candidate monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcg-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search allowed API and notify
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python worker/monitor.py
      - name: Save latest results and notification history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/results.json worker/state.json
          git diff --cached --quiet || (git commit -m 'Update monitored candidates' && git push)
