
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03071a">
<title>TCG Watch Ver.4.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#03071a;color:#f2f5ff;font-family:system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:20px 15px 55px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:27px;margin:0}
h2{font-size:21px;margin:32px 0 15px}
p{line-height:1.65}
small,.muted{color:#a5b3ce}
button,select{background:#193a69;color:white;border:1px solid #42618d;border-radius:13px;padding:12px;font-size:15px}
button:disabled{opacity:.5}
.panel,.notice,.stat{border:1px solid #354767;border-radius:19px;padding:18px;margin:12px 0;background:#060d24}
.notice{border-color:#47756d}
.notice.warn{border-color:#a87640}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{margin:0;padding:15px 10px}
.stat b{display:block;font-size:31px}
.stat span{font-size:12px;color:#a5b3ce}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #354767}
.row:last-child{border:0}
.row strong{font-size:15px}
.row small{display:block;margin-top:5px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.controls select{flex:1;min-width:125px}
.legend{display:flex;flex-wrap:wrap;gap:15px;color:#a5b3ce;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.blue{background:#50a5fa}.green{background:#38ba85}.orange{background:#f0a32e}
canvas{width:100%;height:235px;display:block;margin-top:12px}
.tag{font-size:12px;border:1px solid #52698b;border-radius:20px;padding:5px 9px;white-space:nowrap}
a{color:#8fc3ff}
.product{padding:15px 0;border-bottom:1px solid #354767}
.product:last-child{border:0}
.price{font-size:23px;font-weight:bold}
footer{font-size:12px;color:#a5b3ce;margin-top:30px}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>🃏 TCG Watch</h1>
<p class="muted">監視ダッシュボード Ver.4.1</p>
</div>
<button id="reload">🔄 更新</button>
</header>

<section id="health" class="notice">
データを読み込んでいます…
</section>
<p class="muted" id="updated">最終検索：確認中</p>

<h2>最新の検索状況</h2>
<div class="stats">
<div class="stat"><b id="hits">—</b><span>検索ヒット</span></div>
<div class="stat"><b id="accepted">—</b><span>条件一致</span></div>
<div class="stat"><b id="notified">—</b><span>今回通知</span></div>
</div>

<h2>検索履歴グラフ</h2>
<div class="panel">
<div class="row">
<strong id="historyCount">保存済み 0回</strong>
<select id="historyLimit">
<option value="24">直近24回</option>
<option value="48">直近48回</option>
<option value="100">直近100回</option>
</select>
</div>
<div class="legend">
<span><i class="dot blue"></i>検索ヒット</span>
<span><i class="dot green"></i>条件一致</span>
<span><i class="dot orange"></i>今回通知</span>
</div>
<canvas id="totalChart"></canvas>
<p class="muted" id="historyMessage"></p>
</div>

<h2>商品別の検索履歴</h2>
<div class="panel">
<div class="controls">
<select id="target">
<option value="UA62BT">ジョジョ ブースターBOX</option>
<option value="UA62ST">ジョジョ スタートデッキ</option>
<option value="GD07">ガンダム GD07</option>
<option value="onepiece">ワンピース</option>
</select>
<select id="metric">
<option value="both">検索数＋条件一致数</option>
<option value="apiHits">検索ヒット数</option>
<option value="accepted">条件一致数</option>
</select>
</div>
<div class="stats" style="grid-template-columns:repeat(2,1fr)">
<div class="stat"><b id="targetHits">—</b><span>最新検索ヒット</span></div>
<div class="stat"><b id="targetAccepted">—</b><span>最新条件一致</span></div>
</div>
<div class="legend" style="margin-top:17px">
<span><i class="dot blue"></i>検索ヒット</span>
<span><i class="dot green"></i>条件一致</span>
</div>
<canvas id="targetChart"></canvas>
<p class="muted" id="targetMessage"></p>
</div>

<h2>監視商品</h2>
<div class="panel" id="targets">読み込み中…</div>

<h2>除外理由</h2>
<div class="panel" id="rejected">読み込み中…</div>

<h2>購入・予約候補</h2>
<div class="panel" id="products">読み込み中…</div>

<h2>監視サイト</h2>
<div class="panel">
<div class="row">
<strong>Yahoo!ショッピング</strong>
<span class="tag">API連携中</span>
</div>
<div class="row">
<strong>楽天市場</strong>
<span class="tag">API連携待ち</span>
</div>
</div>

<footer>
検索結果は販売ページで購入・予約可能か確認してください。
<br>画面データは10分ごとに自動取得します。
</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const names={
UA62BT:"ジョジョ ブースターBOX",
UA62ST:"ジョジョ スタートデッキ",
GD07:"ガンダム GD07",
onepiece:"ワンピース"
};
const reasons={
priceExcluded:"価格超過",
nameExcluded:"商品名不一致",
outOfStockExcluded:"在庫なし",
unavailableExcluded:"販売・予約不可",
unknownStockExcluded:"在庫不明",
invalidUrl:"URL不正",
duplicateExcluded:"重複"
};
let result=null,records=[];
const number=v=>Number(v)||0;
const fmt=t=>{
const d=new Date(t);
return isNaN(d)?"不明":d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"});
};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
function draw(id,series,labels){
const canvas=$(id);
const ratio=window.devicePixelRatio||1;
const w=Math.max(canvas.clientWidth,250),h=235;
canvas.width=w*ratio;canvas.height=h*ratio;
const ctx=canvas.getContext("2d");
ctx.scale(ratio,ratio);
ctx.clearRect(0,0,w,h);
const left=40,right=12,top=16,bottom=34;
const pw=w-left-right,ph=h-top-bottom;
const values=series.flatMap(s=>s.values);
const max=Math.max(1,...values.map(number));
ctx.font="11px system-ui";
ctx.lineWidth=1;
for(let i=0;i<=4;i++){
const y=top+ph*i/4;
ctx.strokeStyle="#354767";
ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();
ctx.fillStyle="#91a2c0";
ctx.textAlign="right";
ctx.fillText(Math.round(max*(4-i)/4),left-7,y+4);
}
if(!labels.length)return;
const x=i=>left+(labels.length===1?pw/2:pw*i/(labels.length-1));
const y=v=>top+ph-(number(v)/max)*ph;
for(const s of series){
ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=2;
ctx.beginPath();
s.values.forEach((v,i)=>{
if(i===0)ctx.moveTo(x(i),y(v));
else ctx.lineTo(x(i),y(v));
});
ctx.stroke();
if(labels.length<=40){
s.values.forEach((v,i)=>{
ctx.beginPath();ctx.arc(x(i),y(v),3,0,Math.PI*2);ctx.fill();
});
}
}
ctx.fillStyle="#91a2c0";
ctx.textAlign="left";
ctx.fillText(labels[0]||"",left,h-9);
ctx.textAlign="right";
if(labels.length>1)ctx.fillText(labels.at(-1)||"",w-right,h-9);
}
function renderCharts(){
const limit=number($("historyLimit").value);
const rows=records.slice(-limit);
$("historyCount").textContent="保存済み "+records.length+"回";
const labels=rows.map(r=>{
const d=new Date(r.checkedAt);
return isNaN(d)?"":d.toLocaleString("ja-JP",{
timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",
hour:"2-digit",minute:"2-digit"
});
});
draw("totalChart",[
{color:"#50a5fa",values:rows.map(r=>r.apiHits)},
{color:"#38ba85",values:rows.map(r=>r.accepted)},
{color:"#f0a32e",values:rows.map(r=>r.notifiedCount)}
],labels);
$("historyMessage").textContent=rows.length<2?
"履歴が2回以上になると推移を線で確認できます。":
"表示中："+rows.length+"回分";
const key=$("target").value;
const metric=$("metric").value;
const latest=result?.byTarget?.[key]||{};
$("targetHits").textContent=number(latest.apiHits);
$("targetAccepted").textContent=number(latest.accepted);
const targetRows=rows.map(r=>r.byTarget?.[key]||{});
const series=[];
if(metric!=="accepted")series.push({
color:"#50a5fa",values:targetRows.map(r=>r.apiHits)
});
if(metric!=="apiHits")series.push({
color:"#38ba85",values:targetRows.map(r=>r.accepted)
});
draw("targetChart",series,labels);
$("targetMessage").textContent=
names[key]+"：直近"+rows.length+"回分を表示";
}
function renderResult(){
const d=result||{};
const diag=d.diagnostics||{};
$("hits").textContent=number(diag.apiHits);
$("accepted").textContent=number(diag.accepted);
$("notified").textContent=number(d.notifiedCount);
$("updated").textContent="最終検索："+fmt(d.checkedAt);
$("targets").innerHTML=Object.entries(names).map(([k,name])=>{
const v=d.byTarget?.[k]||{};
return '<div class="row"><div><strong>'+name+
'</strong><small>検索 '+number(v.apiHits)+
'件 / 条件一致 '+number(v.accepted)+
'件</small></div><span class="tag">'+
number(v.accepted)+'件</span></div>';
}).join("");
$("rejected").innerHTML=Object.entries(reasons).map(([k,name])=>{
const n=number(diag[k]);
return n?'<div class="row"><span>'+name+
'</span><strong>'+n+'件</strong></div>':"";
}).join("")||"除外された商品はありません。";
const items=Array.isArray(d.items)?d.items:[];
$("products").innerHTML=items.length?items.map(item=>{
const name=escapeHTML(item.name||item.title||"商品");
const price=number(item.price);
let url=item.url||item.productUrl||"";
try{
const u=new URL(url);
if(!["https:","http:"].includes(u.protocol))url="";
}catch{url="";}
return '<div class="product"><strong>'+name+
'</strong><p class="price">'+
(price?price.toLocaleString("ja-JP")+"円":"価格未確認")+
'</p>'+(url?'<a href="'+escapeHTML(url)+
'" target="_blank" rel="noopener noreferrer">販売ページを確認</a>':"")+
'</div>';
}).join(""):"現在、条件に合う候補はありません。";
}
async function getJSON(path){
const response=await fetch(path+"?t="+Date.now(),{cache:"no-store"});
if(!response.ok)throw Error("HTTP "+response.status);
return response.json();
}
async function load(){
$("reload").disabled=true;
try{
result=await getJSON("./data/results.json");
renderResult();
const age=(Date.now()-new Date(result.checkedAt).getTime())/60000;
$("health").className="notice"+(age>30?" warn":"");
$("health").textContent=age>30?
"⚠ 最終検索から"+Math.floor(age)+"分経過しています。監視処理を確認してください。":
"✓ データ更新を確認。検索結果ファイルを正常に読み込めています。";
}catch(e){
$("health").className="notice warn";
$("health").textContent="⚠ 最新データの取得に失敗："+e.message;
}
try{
const history=await getJSON("./data/history.json");
records=Array.isArray(history.records)?
history.records.filter(r=>r&&r.checkedAt):[];
records.sort((a,b)=>new Date(a.checkedAt)-new Date(b.checkedAt));
}catch(e){
$("historyMessage").textContent="履歴ファイルを取得できません："+e.message;
}
renderCharts();
$("reload").disabled=false;
}
$("reload").onclick=load;
$("historyLimit").onchange=renderCharts;
$("target").onchange=renderCharts;
$("metric").onchange=renderCharts;
window.addEventListener("resize",renderCharts);
load();
setInterval(load,600000);
</script>
</body>
</html>
